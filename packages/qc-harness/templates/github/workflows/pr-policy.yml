name: pr-policy
on:
  # `edited` runs the checks again when a pull request body changes.
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: lts/* }
      - run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable; yarn install --immutable
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi

      # A pull request names the issue it closes, and the issue predates it.
      - run: npx qc pr-check
        env: { GH_TOKEN: "${{ github.token }}" }

      # The lines a pull request adds, and its body, meet the prose style. Vale is a pinned release,
      # and the download is checked against its published hash before it is unpacked.
      - run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -O https://github.com/errata-ai/vale/releases/download/v3.9.1/vale_3.9.1_Linux_64-bit.tar.gz
          echo "fbc2eb47d0b8c50220ed1a2c5c611fbe0904ed567d638143d482016a18fd2db0  vale_3.9.1_Linux_64-bit.tar.gz" | sha256sum -c -
          tar -xzf vale_3.9.1_Linux_64-bit.tar.gz vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npx qc prose --base "origin/$GITHUB_BASE_REF" --pr-body-event
