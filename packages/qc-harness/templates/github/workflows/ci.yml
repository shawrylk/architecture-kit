name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Edit this list if the repository uses another trunk branch.
  # A branch push with no pull request runs no CI.
  push:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * *"
  merge_group:
  workflow_dispatch:
    inputs:
      os:
        description: Platform legs
        type: choice
        required: true
        default: both
        options: [linux, windows, both]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions: { contents: read }

jobs:
  gates:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os == 'linux' && '["ubuntu-latest"]' || github.event_name == 'workflow_dispatch' && inputs.os == 'windows' && '["windows-latest"]' || github.event_name == 'workflow_dispatch' && inputs.os == 'both' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Full history: `qc lint` judges the lines since the merge base.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: lts/* }

      # Install with the package manager of the lockfile, and keep its name for the test step.
      - run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm install --frozen-lockfile; echo "PM=pnpm" >> "$GITHUB_ENV"
          elif [ -f yarn.lock ]; then corepack enable; yarn install --immutable; echo "PM=yarn" >> "$GITHUB_ENV"
          elif [ -f package-lock.json ]; then npm ci; echo "PM=npm" >> "$GITHUB_ENV"
          else npm install; echo "PM=npm" >> "$GITHUB_ENV"
          fi

      # The same three checks the hooks run. Each says when it has nothing to check.
      - run: npx qc check
        if: github.event_name != 'pull_request'
      - run: npx qc check --affected --base origin/main
        if: github.event_name == 'pull_request'
      - run: npx qc typecheck
      # Only the lines this change adds: a problem older than the change never fails it.
      - run: npx qc lint --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}

      # The repository's own tests, when it has a test script.
      - if: github.event_name != 'pull_request'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then "$PM" run test
          else echo "::notice::tests skipped: no test script"
          fi

      # More checks are opt-in, one step each: `npx qc pr-check` (a pull request names an earlier
      # issue) and `npx qc prose` (Vale on the docs a change adds). docs/enforcement.md lists them.

  report-failure:
    needs: gates
    concurrency: { group: "ci-red-${{ github.sha }}", cancel-in-progress: false }
    if: ${{ always() && needs.gates.result == 'failure' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ci-red', 'priority']) {
              try { await github.rest.issues.createLabel({ ...context.repo, name, color: 'd73a4a' }); }
              catch (error) { if (error.status !== 422) throw error; }
            }
            const title = `CI red: ${context.sha}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: 'ci-red,priority' });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({ ...context.repo, title, labels: ['ci-red', 'priority'],
                body: `CI failed for ${context.sha}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            }
