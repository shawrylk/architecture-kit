name: ci
on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: package.json }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # The structural gates. This step needs no package script of its own.
      - run: npx qc check

      # Uncomment each as the repository grows the thing it checks.
      # - run: pnpm typecheck
      # - run: pnpm lint
      # - run: pnpm dup:check
      # - run: pnpm test
