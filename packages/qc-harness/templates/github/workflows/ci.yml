name: ci
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Full history: `qc lint` judges the lines since the merge base.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: lts/* }

      # Install with the package manager of the lockfile, and keep its name for the test step.
      - run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm install --frozen-lockfile; echo "PM=pnpm" >> "$GITHUB_ENV"
          elif [ -f yarn.lock ]; then corepack enable; yarn install --immutable; echo "PM=yarn" >> "$GITHUB_ENV"
          elif [ -f package-lock.json ]; then npm ci; echo "PM=npm" >> "$GITHUB_ENV"
          else npm install; echo "PM=npm" >> "$GITHUB_ENV"
          fi

      # The same three checks the hooks run. Each says when it has nothing to check.
      - run: npx qc check
      - run: npx qc typecheck
      # Only the lines this change adds: a problem older than the change never fails it.
      - run: npx qc lint --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}

      # The repository's own tests, when it has a test script.
      - run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then "$PM" run test
          else echo "::notice::tests skipped: no test script"
          fi

      # More checks are opt-in, one step each: `npx qc pr-check` (a pull request names an earlier
      # issue) and `npx qc prose` (Vale on the docs a change adds). docs/enforcement.md lists them.
