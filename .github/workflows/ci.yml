name: ci

# A push to a pull request branch fires both events, which ran every gate twice.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push: { branches: [main] }
  schedule:
    - cron: "0 2 * * *"
  merge_group:
  workflow_dispatch:
    inputs:
      os:
        description: Platform legs
        type: choice
        required: true
        default: both
        options: [linux, windows, both]

# A superseded push stops; a merge queue entry never cancels, since its result is the merge.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions: { contents: read }

jobs:
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: scan platform risk
        id: risk
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=origin/main
          if [[ "$EVENT" == push ]]; then
            # No previous commit to compare with: keep every platform leg.
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              echo "risky=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base="$BEFORE"
          fi
          node packages/qc-harness/src/cli/qc.mjs platform-risk --base "$base"
      - name: choose platforms
        id: matrix
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RISKY: ${{ steps.risk.outputs.risky }}
          REQUESTED_OS: ${{ inputs.os }}
        run: |
          set -euo pipefail
          os='["ubuntu-latest","windows-latest"]'
          if [[ "$EVENT" == pull_request || "$EVENT" == push ]]; then
            case "$RISKY" in
              false) os='["ubuntu-latest"]' ;;
              true) ;;
              *) echo "Missing platform-risk result" >&2; exit 1 ;;
            esac
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            case "$REQUESTED_OS" in
              linux) os='["ubuntu-latest"]' ;;
              windows) os='["windows-latest"]' ;;
            esac
          fi
          echo "os=$os" >> "$GITHUB_OUTPUT"

  gates:
    needs: plan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Full history: the threshold ratchet compares the registry with the merge base.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The prose check runs its real-Vale test on this leg: a pinned release, checked against its hash.
      - name: install Vale
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -O https://github.com/errata-ai/vale/releases/download/v3.9.1/vale_3.9.1_Linux_64-bit.tar.gz
          echo "fbc2eb47d0b8c50220ed1a2c5c611fbe0904ed567d638143d482016a18fd2db0  vale_3.9.1_Linux_64-bit.tar.gz" | sha256sum -c -
          tar -xzf vale_3.9.1_Linux_64-bit.tar.gz vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Every rule, every gate, every config knob — each with a case that must fail.
      # The hosted runners carry Google Chrome, so a screen test that cannot find it fails here instead of skipping.
      - run: node packages/qc-harness/src/cli/qc.mjs check --affected --base origin/main
        if: github.event_name == 'pull_request'
        env: { QC_REQUIRE_CHROME: "1" }
      - run: node packages/qc-harness/src/cli/qc.mjs check --affected --base "$BEFORE"
        if: github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          QC_REQUIRE_CHROME: "1"
          BEFORE: ${{ github.event.before }}
      - run: pnpm test
        if: github.event_name == 'schedule' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.event.before == '' || github.event.before == '0000000000000000000000000000000000000000'))
        env: { QC_REQUIRE_CHROME: "1" }

      # The kit must still be able to set up a repository from nothing.
      - name: a fresh repository reaches a green check
        run: |
          set -euo pipefail
          qc="$GITHUB_WORKSPACE/packages/qc-harness/src/cli/qc.mjs"
          fresh() { cd "$(mktemp -d)"; git init -q; echo '{"name":"smoke","private":true,"type":"module"}' > package.json; }
          fresh
          node "$qc" init
          node "$qc" check
          if node "$qc" feature orders; then exit 1; fi
          fresh
          node "$qc" init --full
          node "$qc" feature orders
          node "$qc" check

      # The kit is bound by the kit. A rule it ships and cannot itself satisfy is not a rule.
      - name: the kit passes its own gates
        run: node packages/qc-harness/src/cli/qc.mjs check

      - name: the hooks and the lockfile agree
        run: node packages/qc-harness/src/cli/qc.mjs doctor

  report-failure:
    needs: gates
    concurrency: { group: "ci-red-${{ github.sha }}", cancel-in-progress: false }
    if: ${{ always() && needs.gates.result == 'failure' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ci-red', 'priority']) {
              try { await github.rest.issues.createLabel({ ...context.repo, name, color: 'd73a4a' }); }
              catch (error) { if (error.status !== 422) throw error; }
            }
            const title = `CI red: ${context.sha}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: 'ci-red,priority' });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({ ...context.repo, title, labels: ['ci-red', 'priority'],
                body: `CI failed for ${context.sha}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            }
